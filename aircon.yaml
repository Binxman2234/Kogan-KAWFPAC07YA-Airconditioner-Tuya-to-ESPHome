esphome:
  name: name
  friendly_name: friendly_name
  platformio_options:
    build_flags:
      - "-DPIN_SERIAL0_RX=13u"
      - "-DPIN_SERIAL0_TX=14u"
  on_boot:
    priority: -100
    then:
      - lambda: id(aircon).current_temperature = 0;

rtl87xx:
  board: wbr1

logger:
  #level: VERBOSE #for better logging
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: mcu_uart
  tx_pin: PA14
  rx_pin: PA13
  baud_rate: 9600

tuya:

climate:
  - platform: tuya
    id: aircon
    name: "Aircon"
    on_control:
      - delay: 1s
      - uart.write:
          id: mcu_uart
          data: [0x55, 0xAA, 0x00, 0x08, 0x00, 0x00, 0x07]
    switch_datapoint: 1
    target_temperature_datapoint: 2
    supports_heat: false
    supports_cool: true
    active_state:
      datapoint: 4
      cooling_value: 0
      fanonly_value: 1
      drying_value: 2
    fan_mode:
      datapoint: 5
      low_value: 0
      high_value: 1
    visual:
      temperature_step: 1
